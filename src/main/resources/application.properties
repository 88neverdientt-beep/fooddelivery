spring.application.name=fooddelivery

# MySQL DataSource Configuration
spring.datasource.url=${FOOD_DB_URL}
spring.datasource.username=${FOOD_DB_USERNAME}
spring.datasource.password=${FOOD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

fooddelivery.auth.persistence-enabled=true
fooddelivery.jwt.issuer=${FOOD_JWT_ISSUER}
fooddelivery.jwt.audience=${FOOD_JWT_AUDIENCE}
fooddelivery.jwt.private-key-path=${FOOD_JWT_PRIVATE_KEY_PATH}
fooddelivery.jwt.public-key-path=${FOOD_JWT_PUBLIC_KEY_PATH}
server.forward-headers-strategy=none
logging.level.org.springframework.web=INFO
logging.level.root=INFO
