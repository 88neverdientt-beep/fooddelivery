# REVIEW ONLY. Replace example.invalid and certificate paths before validation.
# Standalone nginx configuration: verify with nginx -t on the eventual target.
# Rate limits here supplement the application's existing email/session limits.
events { worker_connections 1024; }
http {
    include mime.types;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    log_format safe '$time_iso8601 $request_id $request_method $status $request_time';
    access_log /var/log/nginx/access.log safe;
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name food.example.invalid;
        return 308 https://food.example.invalid$request_uri;
    }
    server {
        listen 443 ssl;
        server_name food.example.invalid;
        ssl_certificate /run/secrets/tls-chain.pem;
        ssl_certificate_key /run/secrets/tls-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != food.example.invalid) { return 421; }
        root /srv/fooddelivery/frontend;
        client_max_body_size 1m;
        client_body_timeout 15s;
        client_header_timeout 15s;
        send_timeout 15s;
        limit_conn per_ip 20;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        # Enable a long HSTS policy only after validating the real domain's TLS.
        add_header Strict-Transport-Security 'max-age=300' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
        location ~ /\. { deny all; }
        location = /api/actuator { return 404; }
        location ^~ /api/actuator/ { return 404; }
        location = /api/auth/login {
            limit_req zone=auth_per_ip burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:18080/auth/login;
            include /etc/nginx/fooddelivery-proxy.conf;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:18080/;
            include /etc/nginx/fooddelivery-proxy.conf;
        }
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
        location ~ \.(?:js|css|map|json|png|webp|svg|ico|woff2)$ {
            try_files $uri =404;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
