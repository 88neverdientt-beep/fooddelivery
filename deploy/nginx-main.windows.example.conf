# Review-only Windows nginx template. No installation/startup is performed.
# Validate with the chosen nginx binary before activation; trust/hostname need approval.
worker_processes 1;
events { worker_connections 256; }
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format safe '$time_iso8601 $status $request_method $request_time';
    access_log "F:/New folder/fooddelivery-main-runtime/logs/access.log" safe;
    # nginx error messages can include query strings; keep protected and never use token URLs.
    error_log "F:/New folder/fooddelivery-main-runtime/logs/error.log" warn;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name fooddelivery.localhost;
        if ($host != fooddelivery.localhost) { return 421; }
        root "F:/New folder/fooddelivery-main-runtime/current/frontend";
        ssl_certificate "F:/New folder/fooddelivery-main-secrets/main-https-cert.pem";
        ssl_certificate_key "F:/New folder/fooddelivery-main-secrets/main-https-key.pem";
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        location = /api { return 404; }
        location /api/ {
            proxy_pass http://127.0.0.1:18090/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_cookie_path /auth /api/auth;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
